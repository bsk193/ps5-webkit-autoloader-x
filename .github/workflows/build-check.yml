name: Build Check

# Compiles the installer without publishing anything, so changes can be
# validated against the real PS5 SDK toolchain before a release is cut.
# Uploads the ELF as a short-lived artifact for inspection.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        required: false
        default: main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Build the installer
        run: |
          chmod +x build_release.sh
          ./build_release.sh

      - name: Show what was produced
        run: |
          echo "--- artifacts ---"
          ls -la webkit-autoloader-x-installer_v*.elf \
                 webkit-autoloader-x-host_v*.py

          echo "--- generated app metadata ---"
          cat assets/param.json

      - name: Verify this app can coexist with upstream's
        run: |
          python3 - <<'PY'
          import json, re, sys
          a = json.load(open('assets/param.json'))
          print('titleId :', a['titleId'])
          print('deeplink:', a['deeplinkUri'])

          m = re.search(r':(\d+)/', a['deeplinkUri'])
          port = m.group(1) if m else None

          # The served port must match the deeplink, or the homescreen app opens
          # a URL that was never cached.
          hdr = open('include/wkali.h').read()
          wkali_port = re.search(r'#define\s+WKALI_PORT\s+(\d+)', hdr).group(1)

          fail = []
          if a['titleId'] == 'WKAL00001':
              fail.append("title ID collides with upstream PLK's WKAL00001")
          if port == '18181':
              fail.append("deeplink on upstream's port 18181 - AppCache would be shared")
          if port != wkali_port:
              fail.append('deeplink port %s != WKALI_PORT %s - app would open an uncached URL' % (port, wkali_port))
          if fail:
              sys.exit('FAIL: ' + '; '.join(fail))
          print('OK: title ID distinct from upstream; port %s matches WKALI_PORT and is off 18181' % port)
          PY

      - name: Upload built ELF
        uses: actions/upload-artifact@v4
        with:
          name: build-check
          path: |
            webkit-autoloader-x-installer_v*.elf
          retention-days: 3
