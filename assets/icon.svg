<?xml version="1.0" encoding="UTF-8"?>
<svg id="jailbreak_icon" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .jb-badge{fill:url(#jbBadgeGrad);}
      .jb-rim{fill:none;stroke:url(#jbRimGrad);stroke-width:10;}
      .jb-link{fill:none;stroke:url(#jbChainGrad);stroke-width:56;stroke-linejoin:round;}
      .jb-shard{fill:url(#jbChainGrad);}
    </style>

    <!-- Dark sphere, matching the autoloader icon family -->
    <radialGradient id="jbBadgeGrad" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#1d3a66"/>
      <stop offset=".55" stop-color="#0e1f3d"/>
      <stop offset="1" stop-color="#050b18"/>
    </radialGradient>

    <linearGradient id="jbRimGrad" x1="512" y1="12" x2="512" y2="1012" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#83bcf1" stop-opacity=".85"/>
      <stop offset="1" stop-color="#3146a9" stop-opacity=".25"/>
    </linearGradient>

    <!-- "Breaking free" accent: green to cyan, along the chain axis -->
    <linearGradient id="jbChainGrad" x1="240" y1="784" x2="784" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7df966"/>
      <stop offset="1" stop-color="#57c2ff"/>
    </linearGradient>
  </defs>

  <circle class="jb-badge" cx="512" cy="512" r="500"/>
  <circle class="jb-rim" cx="512" cy="512" r="505"/>

  <!-- Lower-left link -->
  <rect class="jb-link" x="200.6" y="548.4" width="340" height="210" rx="105"
        transform="rotate(-45 370.6 653.4)"/>

  <!-- Upper-right link, pulled away along the same axis -->
  <rect class="jb-link" x="483.4" y="265.6" width="340" height="210" rx="105"
        transform="rotate(-45 653.4 370.6)"/>

  <!-- Snap debris in the gap -->
  <polygon class="jb-shard" points="547,521 573,547 547,573 521,547"/>
  <polygon class="jb-shard" points="477,451 497,471 477,491 457,471"/>
  <polygon class="jb-shard" points="590,466 606,482 590,498 574,482"/>
</svg>
