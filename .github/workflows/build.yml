name: Build

# Installer ELF + PC host (.py / .exe) on every branch push and pull request.
# release.yml calls this workflow with the exact release version; tags are
# handled there, not here.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Version compiled in (e.g. 1.1.0 or 1.1.1-beta.1). Empty = dev build.'
        type: string
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}-${{ inputs.version || 'dev' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !inputs.version }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      artifact_suffix: ${{ steps.v.outputs.suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags for `git describe` (dev version)
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(bash tools/fork_version.sh dev)" >> "$GITHUB_OUTPUT"
            echo "suffix=-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "Building WebKit Autoloader X $(bash tools/fork_version.sh dev) / based on v$(bash tools/fork_version.sh upstream)"

  build-linux:
    runs-on: ubuntu-latest
    needs: version
    env:
      X_VERSION: ${{ needs.version.outputs.version }}
      ARTIFACT_SUFFIX: ${{ needs.version.outputs.artifact_suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build installer ELF and PC host script
        run: |
          chmod +x build_release.sh
          ./build_release.sh

      - name: Verify the version and that this app can coexist with upstream's
        run: |
          set -euo pipefail
          ELF=$(ls webkit-autoloader-x-installer_v*_ps5.elf)
          echo "ELF: $ELF"
          # Fork marker carries our semver and the PLK base it was built on.
          MARK=$(strings "$ELF" | grep -m1 '^WKALI_X_VER:' || true)
          echo "marker: $MARK"
          EXPECT="WKALI_X_VER:${X_VERSION} WKALI_X_BASE:$(bash tools/fork_version.sh upstream)"
          [ "$MARK" = "$EXPECT" ] || { echo "::error::version marker '$MARK' != '$EXPECT'"; exit 1; }

          python3 - <<'PY'
          import json, re, sys
          a = json.load(open('assets/param.json'))
          print('titleId :', a['titleId'])
          print('deeplink:', a['deeplinkUri'])

          m = re.search(r':(\d+)/', a['deeplinkUri'])
          port = m.group(1) if m else None

          # The served port must match the deeplink, or the homescreen app opens
          # a URL that was never cached.
          hdr = open('include/wkali.h').read()
          wkali_port = re.search(r'#define\s+WKALI_PORT\s+(\d+)', hdr).group(1)

          fail = []
          if a['titleId'] == 'WKAL00001':
              fail.append("title ID collides with upstream PLK's WKAL00001")
          if port == '18181':
              fail.append("deeplink on upstream's port 18181 - AppCache would be shared")
          if port != wkali_port:
              fail.append('deeplink port %s != WKALI_PORT %s - app would open an uncached URL' % (port, wkali_port))
          if fail:
              sys.exit('FAIL: ' + '; '.join(fail))
          print('OK: title ID distinct from upstream; port %s matches WKALI_PORT and is off 18181' % port)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: payload-linux
          path: |
            webkit-autoloader-x-installer_v*_ps5.elf
            webkit-autoloader-x-host_v*_pc.py
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: icon
          path: assets/icon.ico
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    needs: [version, build-linux]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - uses: actions/download-artifact@v4
        with:
          name: payload-linux
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: icon
          path: assets

      - name: Build Windows executable
        shell: bash
        run: |
          BASE="webkit-autoloader-x-host_v${{ needs.version.outputs.version }}${{ needs.version.outputs.artifact_suffix }}"
          pyinstaller --onefile --noconfirm --icon assets/icon.ico --name "${BASE}_windows" "${BASE}_pc.py"

      - uses: actions/upload-artifact@v4
        with:
          name: payload-windows
          path: dist/webkit-autoloader-x-host_v*_windows.exe
          retention-days: 30
